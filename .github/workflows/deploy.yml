name: Redeploy to Azure

on:
  workflow_dispatch:
    inputs:
      allow_demo_data_reset:
        description: 'I accept that redeploying may reset container-local SQLite data'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: azure-redeploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  API_APP: ${{ vars.AZURE_API_APP }}
  FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate deployment configuration
        env:
          ALLOW_RESET: ${{ inputs.allow_demo_data_reset }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [[ "$ALLOW_RESET" != "true" ]]; then
            echo "::error::Confirm the demo data reset checkbox before running this workflow."
            exit 1
          fi
          for name in RESOURCE_GROUP ACR_NAME API_APP FRONTEND_APP CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name. See infra/README.md."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/api-ts/package-lock.json
            src/frontend/package-lock.json

      - name: Build and test TypeScript API
        working-directory: src/api-ts
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test -- --run

      - name: Build frontend
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing resources
        id: resources
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az group show --name "$RESOURCE_GROUP" --output none
          registry=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          api_environment=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.managedEnvironmentId -o tsv)
          frontend_environment=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.managedEnvironmentId -o tsv)
          if [[ "${api_environment,,}" != "${frontend_environment,,}" ]]; then
            echo "::error::Both apps must share a Container Apps environment to reach the internal API."
            exit 1
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Build and push container images
        env:
          REGISTRY: ${{ steps.resources.outputs.registry }}
        run: |
          set -euo pipefail
          # The API Dockerfile expects the shared SQL migrations in its build context.
          cp -R src/database src/api-ts/database
          az acr login --name "$ACR_NAME"
          docker build --tag "$REGISTRY/api:$IMAGE_TAG" src/api-ts
          docker build --tag "$REGISTRY/frontend:$IMAGE_TAG" src/frontend
          docker push "$REGISTRY/api:$IMAGE_TAG"
          docker push "$REGISTRY/frontend:$IMAGE_TAG"

      - name: Redeploy API (internal ingress)
        id: api
        env:
          REGISTRY: ${{ steps.resources.outputs.registry }}
        run: |
          set -euo pipefail
          frontend_host=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          az containerapp ingress enable -g "$RESOURCE_GROUP" -n "$API_APP" \
            --type internal --target-port 3000 --transport http --output none
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" \
            --image "$REGISTRY/api:$IMAGE_TAG" \
            --set-env-vars "NODE_ENV=production" "API_CORS_ORIGINS=https://$frontend_host" \
            --output none
          api_host=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "host=$api_host" >> "$GITHUB_OUTPUT"

      - name: Redeploy frontend (same-origin API proxy)
        id: frontend
        env:
          REGISTRY: ${{ steps.resources.outputs.registry }}
          API_HOST: ${{ steps.api.outputs.host }}
        run: |
          set -euo pipefail
          az containerapp update -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" \
            --image "$REGISTRY/frontend:$IMAGE_TAG" \
            --set-env-vars "API_HOST=$API_HOST" "API_PORT=443" "API_PROTOCOL=https" "API_PROXY_ENABLED=true" \
            --output none
          host=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Configure health probes and verify log collection
        run: |
          set -euo pipefail
          python3 scripts/configure-probes.py --resource-group "$RESOURCE_GROUP" --app "$API_APP" \
            --port 3000 --live /api/health/live --ready /api/health/ready
          python3 scripts/configure-probes.py --resource-group "$RESOURCE_GROUP" --app "$FRONTEND_APP" \
            --port 80 --live /healthz --ready /readyz
          environment=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.managedEnvironmentId -o tsv)
          destination=$(az resource show --ids "$environment" --api-version 2024-03-01 \
            --query properties.appLogsConfiguration.destination -o tsv)
          workspace=$(az resource show --ids "$environment" --api-version 2024-03-01 \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          if [[ "$destination" != "log-analytics" || -z "$workspace" ]]; then
            echo "::error::Container Apps environment must have Log Analytics collection enabled. See infra/README.md."
            exit 1
          fi
          for app in "$API_APP" "$FRONTEND_APP"; do
            id=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query id -o tsv)
            az monitor metrics list-definitions --resource "$id" --query "[].name.value" -o json
          done

      - name: Verify frontend and proxied API
        env:
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 \
            --max-time 20 "$FRONTEND_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 \
            --max-time 20 "$FRONTEND_URL/api/products" --output /dev/null
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 \
            --max-time 20 "$FRONTEND_URL/api/health/ready" --output /dev/null
          node --input-type=module <<'JS'
          const base = process.env.FRONTEND_URL;
          const request = (path, options = {}) => fetch(`${base}${path}`, {
            ...options, signal: AbortSignal.timeout(20000),
          });
          const runtime = await request('/runtime-config.js');
          if (!runtime.ok || !(await runtime.text()).includes('window.location.origin')) {
            throw new Error('Frontend runtime configuration must use the same-origin proxy');
          }
          const products = await request('/api/products');
          if (!products.ok || !Array.isArray(await products.json())) throw new Error('Product API failed');
          for (const [path, status] of [
            ['/api/health/live', 'ok'], ['/api/health/ready', 'ready'], ['/healthz', 'ok'],
          ]) {
            const response = await request(path);
            if (!response.ok || (await response.json()).status !== status) {
              throw new Error(`Health verification failed: ${path}`);
            }
          }
          const ready = await request('/readyz');
          if (!ready.ok) throw new Error('Frontend readiness failed');
          const session = await request('/api/auth/me');
          if (session.status !== 401) throw new Error(`Unauthenticated session returned ${session.status}, expected 401`);
          const login = await request('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Origin: base },
            body: JSON.stringify({ email: `ci-${crypto.randomUUID()}@example.invalid`, password: crypto.randomUUID() }),
          });
          if (login.status !== 401) throw new Error(`Unknown-account login returned ${login.status}, expected 401`);
          console.log('Frontend, products, health/readiness, private-session guard and invalid-login checks passed.');
          JS
          printf '## Deployment verified\n\nFrontend: %s\n\nAPI stays internal; requests use the frontend proxy.\n\nImage tag: `%s`\n' \
            "$FRONTEND_URL" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
